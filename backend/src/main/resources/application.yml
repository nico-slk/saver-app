spring:
  application:
    name: saver
  config:
    # En local lee el .env del repo (ejecutar desde la carpeta backend). En prod se usan variables de entorno.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:saver}
    username: ${DB_USER:saver}
    password: ${DB_PASSWORD:saver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-must-be-at-least-32-chars-long}
    issuer: saver-api
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: Strict
  storage:
    provider: ${STORAGE_PROVIDER:s3-compatible}
    environment: ${STORAGE_ENVIRONMENT:development}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    bucket: ${STORAGE_BUCKET:saver-dev-media}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:saver-dev}
    secret-key: ${STORAGE_SECRET_KEY:saver-dev-secret}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
  web:
    # URL pública del frontend: se usa en los links de los emails (restablecer contraseña).
    base-url: ${APP_WEB_URL:http://localhost:5173}
  mail:
    # log (sin enviar, solo log) | mailpit (Docker local) | brevo (envío real, plan gratuito)
    provider: ${MAIL_PROVIDER:log}
    from-address: ${MAIL_FROM_ADDRESS:no-reply@saver.local}
    from-name: ${MAIL_FROM_NAME:Saver}
    mailpit-url: ${MAIL_MAILPIT_URL:http://localhost:8025}
    brevo-api-key: ${MAIL_BREVO_API_KEY:}
  inflation:
    # Descarga diaria de la inflación oficial (ARS: INDEC vía ArgentinaDatos; USD: IPC de EE.UU. vía BLS).
    # Sin internet no falla: se usa la inflación manual del usuario (o 0).
    enabled: ${INFLATION_SYNC_ENABLED:true}
    sync-on-startup: ${INFLATION_SYNC_ON_STARTUP:true}
    estimate-months: ${INFLATION_ESTIMATE_MONTHS:3}
    argentina-datos-url: ${INFLATION_ARGENTINADATOS_URL:https://api.argentinadatos.com}
    bls-url: ${INFLATION_BLS_URL:https://api.bls.gov}
    bls-api-key: ${INFLATION_BLS_API_KEY:}
  defaults:
    timezone: America/Argentina/Buenos_Aires
    currency: ARS
    locale: es

springdoc:
  swagger-ui:
    path: /swagger-ui.html
